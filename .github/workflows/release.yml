name: Release

on:
  push:
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

jobs:
  check_version_change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version_code: ${{ steps.check.outputs.version_code }}
      version_name: ${{ steps.check.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check version change
        id: check
        run: |
          NEW_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NEW_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OLD_CODE=$(git show HEAD^:app/build.gradle.kts 2>/dev/null | grep -oP 'versionCode = \K[0-9]+' || echo "0")
          echo "version_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$NEW_NAME" >> $GITHUB_OUTPUT
          if [ "$NEW_CODE" != "$OLD_CODE" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_version_change
    if: needs.check_version_change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Build APK
        env:
          SIGNING_KEYSTORE_PATH: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version_change.outputs.version_name }}
          name: v${{ needs.check_version_change.outputs.version_name }}
          files: app/build/outputs/apk/githubRelease/app-githubRelease.apk
          body: "Release v${{ needs.check_version_change.outputs.version_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}