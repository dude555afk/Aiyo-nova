name: Build and release Aiyo Nova
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'data/**'
      - 'domain/**'
      - 'ui/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'data/**'
      - 'domain/**'
      - 'ui/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aiyo-nova-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aiyo Nova changes
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble complete Aiyo Nova source tree
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/beradeep/aiyo.git source
          git -C source checkout --detach fff8f5052a841961f8a61255da1337ea0bf90b47
          for module in data domain ui; do
            mkdir -p "source/$module/src"
            cp -a "$GITHUB_WORKSPACE/$module/src/." "source/$module/src/"
          done
          DI_DIR="source/app/src/main/java/com/beradeep/aiyo/di"
          mkdir -p "$DI_DIR"
          cp "$GITHUB_WORKSPACE/app/src/main/java/com/beradeep/aiyo/di/ApiModule.kt" "$DI_DIR/ApiModule.kt"
          cp "$GITHUB_WORKSPACE/app/src/main/java/com/beradeep/aiyo/di/RepositoryModule.kt" "$DI_DIR/RepositoryModule.kt"
          cp "$GITHUB_WORKSPACE/app/src/main/java/com/beradeep/aiyo/di/VmModule.kt" "$DI_DIR/VmModule.kt"
          cp "$GITHUB_WORKSPACE/app/src/main/res/values/strings.xml" "source/app/src/main/res/values/strings.xml"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("source/data/build.gradle.kts")
          text = p.read_text()
          text, count = re.subn(r"runtimeOnly\(libs\.ktor\.client\.okhttp\)", "implementation(libs.ktor.client.okhttp)\n    implementation(libs.okhttp)", text, count=1)
          if count != 1:
              raise SystemExit("Could not add Kilo networking dependencies")
          if "okhttp-bom:5.1.0" not in text:
              text, count = re.subn(r"(?m)^dependencies\s*\{", 'dependencies {\n    implementation(platform("com.squareup.okhttp3:okhttp-bom:5.1.0"))', text, count=1)
              if count != 1:
                  raise SystemExit("Could not insert OkHttp BOM")
          p.write_text(text)
          p = Path("source/app/build.gradle.kts")
          text = p.read_text()
          text, app_id_count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.dude555afk.aiyonova"',
              text,
              count=1,
          )
          text, a = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 12", text, count=1)
          text, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.1.1"', text, count=1)
          if app_id_count != 1 or a != 1 or b != 1:
              raise SystemExit("Could not set Aiyo Nova application ID/version")
          p.write_text(text)
          PY
      - name: Generate release signing key
        working-directory: source/app
        run: |
          keytool -genkeypair -keystore aiyo-nova.jks -storepass android -keypass android \
            -alias aiyo-nova -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Aiyo Nova, OU=Android, O=Aiyo Nova, L=Internet, ST=Internet, C=US'
      - name: Build Aiyo Nova release APK
        working-directory: source
        env:
          SIGNING_KEYSTORE_PATH: aiyo-nova.jks
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: aiyo-nova
          SIGNING_KEY_PASSWORD: android
        run: |
          gradle :app:assembleGithubRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/githubRelease/app-githubRelease.apk
      - name: Publish APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="source/app/build/outputs/apk/githubRelease/app-githubRelease.apk"
          TAG="aiyo-nova-1.1.1-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "Aiyo Nova 1.1.1" --notes "Aiyo Nova 1.1.1. Uses unauthenticated Kilo AI Gateway model discovery; paid-model execution may require authorization."
