name: Build and release Aiyo Nova

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-aiyo-nova.yml'
      - 'app/**'
      - 'data/**'
      - 'domain/**'
      - 'ui/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiyo-nova-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aiyo Nova
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate release signing key
        run: |
          keytool -genkeypair -keystore aiyo-nova.jks -storepass android -keypass android \
            -alias aiyo-nova -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Aiyo Nova, OU=Android, O=Aiyo Nova, L=Internet, ST=Internet, C=US'

      - name: Build release APK from this repository
        env:
          SIGNING_KEYSTORE_PATH: aiyo-nova.jks
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: aiyo-nova
          SIGNING_KEY_PASSWORD: android
        run: |
          gradle :app:assembleGithubRelease --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/githubRelease/app-githubRelease.apk"
          test -s "$APK"
          TAG="aiyo-nova-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aiyo Nova ${TAG}" \
            --notes "Built from the Aiyo Nova repository. Uses Kilo AI Gateway anonymous free-model access."
